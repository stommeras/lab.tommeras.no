<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIP-8</title>
<style>
  :root { --fg: #6f6; --dim: #3a3; --bg: #000; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, "Courier New", monospace; }
  main { max-width: 768px; margin: 0 auto; }
  canvas { display: block; width: 100%; aspect-ratio: 2; image-rendering: pixelated; background: #000; outline: 1px solid var(--fg); }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
  select, input, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--dim); border-radius: 0; padding: 2px 6px; }
  input[type=file] { padding: 0; border: 0; }
  input[type=file]::file-selector-button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--dim); border-radius: 0; padding: 2px 6px; margin-right: 8px; cursor: pointer; }
  button { cursor: pointer; }
  button:hover, input[type=file]::file-selector-button:hover { background: var(--fg); color: var(--bg); }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
  :disabled, :disabled::file-selector-button { opacity: .5; cursor: default; }
  #speed { width: 5em; }
  #status { margin-top: 12px; min-height: 1.5em; }
  #status::before { content: "> "; }
  #stats { margin-top: 4px; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div id="controls">
    <label>Core
      <select id="core">
        <option value="zig">Zig</option>
        <option value="rust">Rust</option>
      </select>
    </label>
    <label>Quirks
      <select id="quirks" autocomplete="off">
        <option value="63">COSMAC VIP</option>
        <option value="14">Octo (modern CHIP-8)</option>
      </select>
    </label>
    <label>Game
      <select id="game" autocomplete="off">
        <option value="">Pick a game</option>
      </select>
    </label>
    <label>ROM <input id="rom" type="file" accept=".ch8,.rom" disabled></label>
    <label>Steps per frame <input id="speed" type="number" min="1" max="1000" value="11" autocomplete="off"></label>
    <button id="pause" type="button">Pause</button>
    <button id="mute" type="button">Mute</button>
  </div>
  <canvas id="screen" width="64" height="32" role="img" aria-label="CHIP-8 screen"></canvas>
  <div id="status" aria-live="polite">Pick a ROM to start. Keys: 1 2 3 4 / Q W E R / A S D F / Z X C V. P pauses and M mutes.</div>
  <div id="stats"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
